<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body onload="tampilkanArray()">
    <h1>contoh array di javascript</h1>
    <p id="pertama"></p>
    <p id="kedua"></p>
    <p id="hapus"></p>
    <p id="hapuspertama"></p>
    <p id="panjang"></p>
    <p id="semuahewan"></p>
    <script>
        function tampilkanArray() {
            // membuat array sederhana berisi nama-nama hewan
            var hewan = ["kancil", "semut", "singa", "gajah", "lalat", "monyet", "kucing", "cicak", "katak", "harimau", "kangguru"];
            // mengakses elemen dari array
            document.getElementById("pertama").innerHTML = "hewan pertama: " + hewan[0];
            document.getElementById("kedua").innerHTML = "heawan kedua: " + hewan[1];
            // menambahkan hewan baru ke array
            hewan.push("ular"); // 'push' di gunakan untuk menambahkan item
            // menghapus -ular terakhir dari array menggunakan pop
            var hewanterakhir = hewan.pop(); // 'pop' digunakan untuk menghapus hewan terakhir
            // menghapus buah pertama dari array menggunakan pop
            var hewanpertama = hewan.shift();// 'shift' digunakan untuk menghapus buah pertama
            // menampilkan hasil setelah menghapus hewan terakhir
            document.getElementById("hapus").innerHTML = "hewan terakhir yang dihapus: " + hewanterakhir;
            // menampilkan hasil setelah menghapus hewan pertama
            document.getElementById("hapuspertama").innerHTML = "hewan pertama yang dihapus: " + hewanpertama;
            // menampilkan pamjang array dan semua elemennya
            document.getElementById("panjang").innerHTML = "total hewan setelah penghapusan; " + hewan.length;
            document.getElementById("semuahewan").innerHTML = "semua hewan: " + hewan.join(", ");
        }
    </script>
    
</body>
</html>
