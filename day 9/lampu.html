<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>kontrol lampu menggunakan javascript</h2>

    <p>tekan tombol di bawah untuk menghidupkan atau mematikan lampu.</p>

    <button onclick="document.getElementById('myImage').src='../img/lampu hidup.jpg'">
        nyalakan lampu
    </button>

    <img id="myImage" src="../img/lampu mati.jpg" style="width:100px">

    <button onclick="document.getElementById('myImage').src='../img/lampu mati.jpg'">
     matikan lampu
    </button>
    
</body>
</html>
