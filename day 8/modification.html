<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- konten -->
     <div id="myDiv">hello, word</div>
     <!-- Atribut -->
       <img id="myImage" src="../img/pengapdi iput switi.jpg" alt="gambar awal">

       <!-- css -->
        <div id="myDiv" style="width: 100px; height: 100px; background-color: lightblue;">
          contoh element  
        </div>
        <script>
            // mengubah konten id myDiv
            let myDiv = document.getElementById('myDiv');

            // mengubah atribut 'src' dari elemen gambar
            document.getElementById("myImage").setAttribute("src", "../img/pengapdi iput switi.jpg");
            document.getElementById("myImage").setAttribute("alt", "../img/pengapdi iput switi.jpg");

            // mengubah properti css elemen
            let div = document.getElementById("myDiv");
            div.style.backgroundColor = "lightgreen"
            div.style.width = "200px";
            div.style.height = "200px";
        </script>

</body>
</html>
