<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Siswa</title>
</head>
<body>
    <h1>Biodata Siswa</h1>
    <div class="identitas">nama : amalina</div>
    <div class="identitas">kelas : x</div>
    <div class="identitas">jurusan : tkj</div>

    <h2>Masukkan Nama Siswa</h2>
    <input type="text" id="nama" placeholder="masukkan nama">
    <br><br>
    <button onclick="tampilkanBiodata()">Tampilkan Biodata</button>

    <h3>Hasil Biodata</h3>
    <p id="hasil"></p>

    <script>
        // Fungsi validasi form
        function tampilkanBiodata() {
            let nama = document.getElementById("nama").value;
            // Hapus .value di sini karena class diambil dari elemen div
            let identitas = document.getElementsByClassName("identitas");

            // Jika input nama kosong, tampilkan pesan
            if (nama === "") {
                alert("nama harus diisi");
                return false;
            } else {
                // Jika nama diisi, tampilkan alert sesuai nama yang diinput
                alert("selamat datang, " + nama);

                // Mengambil isi teks dari elemen dengan class identitas
                let kelas = identitas[1].textContent;
                let jurusan = identitas[2].textContent;

                // Menampilkan biodata ke elemen <p id="hasil">
                document.getElementById("hasil").innerHTML = 
                    "Nama: " + nama + "<br>" + kelas + "<br>" + jurusan;
                
                return true;
            }
        }
    </script>
</body>
</html>
